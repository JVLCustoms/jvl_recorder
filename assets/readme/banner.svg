<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL Recorder — record Rockstar Editor clips from your FiveM server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0c2340" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2f8cf0"/>
      <stop offset="0.6" stop-color="#7dd3fc"/>
      <stop offset="0.95" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .rec { animation: rec 1s ease-in-out infinite; }
      @keyframes rec { 50% { opacity: 0.2; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#topline)"/>
    <rect x="0" y="338" width="1200" height="2" fill="url(#topline)" opacity="0.5"/>

    <g class="t">
      <text x="64" y="104" fill="#8ea2c0" font-size="15" font-weight="700" letter-spacing="4">JVL MEDIACODE · FREE</text>
      <text x="62" y="162" fill="#e2ecf7" font-size="56" font-weight="800">JVL Recorder</text>
      <text x="64" y="200" fill="#9fb3cf" font-size="19">Rockstar Editor clips without leaving the server.</text>
      <text x="64" y="226" fill="#9fb3cf" font-size="19">Record, save, discard. The game keeps playing.</text>
      <g font-size="14" font-weight="700">
        <rect x="64" y="254" width="120" height="30" rx="8" fill="#0f1a2c" stroke="#2f8cf0" stroke-width="2"/>
        <text x="124" y="274" fill="#e2ecf7" text-anchor="middle">Qbox · QB · ESX</text>
        <rect x="194" y="254" width="112" height="30" rx="8" fill="#0f1a2c" stroke="#2f8cf0" stroke-width="2"/>
        <text x="250" y="274" fill="#e2ecf7" text-anchor="middle">Standalone</text>
        <rect x="316" y="254" width="62" height="30" rx="8" fill="#0f1a2c" stroke="#22c55e" stroke-width="2"/>
        <text x="347" y="274" fill="#86efac" text-anchor="middle">MIT</text>
      </g>
    </g>

    <!-- compact unit: viewfinder + keys -->
    <g transform="translate(790 36)">
      <rect width="300" height="268" rx="26" fill="#07090c" fill-opacity="0.85" stroke="#26384f" stroke-width="2"/>
      <g class="t">
        <text x="20" y="38" fill="#e9eef5" font-size="15" font-weight="700">Recorder</text>
        <rect x="256" y="20" width="26" height="26" rx="8" fill="#0ea5e9" fill-opacity="0.15"/>
        <rect x="18" y="56" width="264" height="96" rx="16" fill="#08111d"/>
        <g stroke="#9fb0c3" stroke-width="2" fill="none" opacity="0.7">
          <path d="M28 76 v-12 h12"/><path d="M272 76 v-12 h-12"/><path d="M28 132 v12 h12"/><path d="M272 132 v12 h-12"/>
        </g>
        <g class="rec"><circle cx="122" cy="84" r="6" fill="#ef4444"/></g>
        <text x="134" y="89" fill="#fca5a5" font-size="12" font-weight="700" letter-spacing="2">REC</text>
        <text x="150" y="132" fill="#ffffff" font-size="34" font-weight="700" text-anchor="middle">00:42</text>
        <g font-size="13" fill="#e9eef5">
          <rect x="18" y="164" width="264" height="26" rx="8" fill="#111a26" fill-opacity="0.8"/>
          <rect x="26" y="168" width="22" height="18" rx="5" fill="#94c5e9" fill-opacity="0.15"/><text x="37" y="181" font-weight="700" text-anchor="middle">7</text>
          <circle cx="62" cy="177" r="4" fill="#ef4444"/><text x="74" y="182">Record</text>
          <rect x="18" y="196" width="264" height="26" rx="8" fill="#111a26" fill-opacity="0.8"/>
          <rect x="26" y="200" width="22" height="18" rx="5" fill="#94c5e9" fill-opacity="0.15"/><text x="37" y="213" font-weight="700" text-anchor="middle">8</text>
          <rect x="58" y="205" width="8" height="8" rx="1" fill="#34d399"/><text x="74" y="214">Save clip</text>
          <rect x="18" y="228" width="264" height="26" rx="8" fill="#111a26" fill-opacity="0.8"/>
          <rect x="26" y="232" width="22" height="18" rx="5" fill="#94c5e9" fill-opacity="0.15"/><text x="37" y="245" font-weight="700" text-anchor="middle">9</text>
          <text x="74" y="246">Discard</text>
        </g>
      </g>
    </g>
  </g>
</svg>
